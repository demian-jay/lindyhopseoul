# Include at server scope, before location blocks in default.d/lindyhop.conf.
# Google OAuth callbacks are registered on the bare domains, not their www
# aliases. Redirect before starting OAuth so its state cookie and callback stay
# on the same origin. Keep the original path and query string.
if ($host = www.swingpopseoul.com) {
    return 308 https://swingpopseoul.com$request_uri;
}
if ($host = www.lindyhopseoul.com) {
    return 308 https://lindyhopseoul.com$request_uri;
}
