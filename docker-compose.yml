services:
  mariadb:
    image: mariadb:11.8
    container_name: lindyhopseoul-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-lindyhopseoul}
      MARIADB_USER: ${MARIADB_USER:-lindyhop_dev}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-lindyhop_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-lindyhop_root_dev_password}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mariadb-data:
